version: '3.8'

services:
  socket-proxy:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - socket-proxy-recordings:/app/recordings
    environment:
      - VALKEY_ADDR=${VALKEY_ADDR}
      - DD_ENABLED=${DD_ENABLED:-false}
      - DD_AGENT_HOST=host.docker.internal
      - DD_DOGSTATSD_PORT=8125
    command: ["./socket-proxy", "--auto-connect=true"]

volumes:
  socket-proxy-recordings: